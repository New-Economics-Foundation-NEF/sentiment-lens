[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-lens"
version = "0.1.0"
description = "Extreme Wealth Line: collecting and labelling social media comments about extreme wealth"
requires-python = ">=3.9"

# Only what every path needs. The optional backends stay optional on purpose:
# a missing one disables an arm of the scorecard rather than breaking the run,
# which is what lets the pipeline work on a machine with no API keys.
dependencies = [
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "vaderSentiment==3.3.2",
    "google-api-python-client>=2.100",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0,<2"]
openai = ["openai>=1.0,<4"]
google = ["google-genai>=1.0"]
ollama = ["ollama==0.4.7"]
retrieval = ["sentence-transformers>=2.2"]
language = ["langdetect==1.0.9"]
# Reading and writing .xlsx coder files (slens-validate, slens-agreement, the scripts/ helpers)
# and plotting.
analysis = ["openpyxl>=3.1", "matplotlib>=3.8"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
slens-collect  = "sentiment_lens.collect.youtube:main"
slens-collect-full-corpus = "sentiment_lens.collect.youtube_full_corpus:main"
slens-merge    = "sentiment_lens.collect.merge:main"
slens-clean-videos = "sentiment_lens.collect.clean_videos:main"
slens-redact   = "sentiment_lens.collect.redact:main"
slens-gemma    = "sentiment_lens.label.classify_gemma:main"
slens-batches  = "sentiment_lens.collect.batches:main"
slens-anthropic-batch = "sentiment_lens.label.anthropic_batch:main"
slens-primary-category = "sentiment_lens.collect.primary_category:main"
slens-adjudicate = "sentiment_lens.analyse.adjudicate:main"
slens-classify = "sentiment_lens.label.classify:main"
slens-keywords = "sentiment_lens.label.keywords:main"
slens-evaluate = "sentiment_lens.analyse.evaluate:main"
slens-agreement = "sentiment_lens.analyse.agreement:main"
slens-validate = "sentiment_lens.analyse.validate:main"
slens-report   = "sentiment_lens.analyse.report:main"
slens-export-dashboard = "sentiment_lens.analyse.export_dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentiment_lens = ["keywords.yml"]
