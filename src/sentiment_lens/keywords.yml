# CAUTION — circular terms.
# Some terms above name the subject of a specific story rather than a harm:
# "twitter", "x.com", "platform", "free speech" and "news" under democracy;
# "private jet" and "flight" under environment; "insurance compan*" under
# economics. Under the story they belong to, they will label a comment for
# merely mentioning what everyone is already talking about.
# Measured on the Musk/Reddit thread: democracy falls from 43% to 22% of
# comments once those five terms are removed. Report per-story figures with
# story-specific terms excluded, or report both.
