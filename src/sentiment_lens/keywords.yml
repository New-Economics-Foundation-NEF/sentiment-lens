# Harm-domain vocabulary, seeded from "Risks of Extreme Wealth" (Shotter, 2024)
# and "Exploring an Extreme Wealth Line" (NEF/GAM/PM UK, 2025).
#
# This list is meant to be edited by the team, not by the code. Every term here
# is a decision someone can argue with, which is the point: unlike the LLM, a
# reader can see exactly why a comment was labelled the way it was.
#
# Terms are matched case-insensitively on word boundaries. Use a trailing * for
# a prefix match (tax* matches tax, taxes, taxation).

