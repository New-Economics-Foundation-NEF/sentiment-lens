name: docs

# Builds the documentation site on every pull request, and deploys it to GitHub Pages on a
# push to main. `--strict` turns any warning (a broken link, a page missing from the nav) into
# a failure. docs/cli.md is committed; regenerate it with `python docs/gen_cli.py`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.5"

      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: "1"   # silences Material's end-of-life banner, not a build warning
        run: mkdocs build --strict --site-dir site

      - name: Upload the site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
